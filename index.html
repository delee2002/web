<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="지자체 협력사업 예산 승인·반려 자동 판정 페이지">
  <title>지자체 협력사업 예산 자동 판정</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">자치행정 협력사업</p>
      <h1>지자체별 예산 자동 판정</h1>
      <p class="description">한도액은 인구수 × 10원이며, 신청액이 한도액보다 크면 반려됩니다.</p>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <section class="summary-grid" aria-label="심사 결과 요약">
      <article class="summary-card approved">
        <span>승인 건수</span>
        <strong id="approvedCount">-</strong>
      </article>
      <article class="summary-card rejected">
        <span>반려 건수</span>
        <strong id="rejectedCount">-</strong>
      </article>
      <article class="summary-card amount">
        <span>승인 신청액 합계</span>
        <strong id="approvedAmount">-</strong>
      </article>
    </section>

    <section class="panel" aria-labelledby="tableTitle">
      <div class="panel-heading">
        <div>
          <h2 id="tableTitle">신청 내역</h2>
          <p id="resultInfo" aria-live="polite">데이터를 불러오는 중입니다.</p>
        </div>
        <button id="reloadButton" type="button">새로고침</button>
      </div>

      <div id="errorMessage" class="error" role="alert" hidden></div>
      <div class="table-wrap">
        <table>
          <caption class="sr-only">지자체명, 인구수, 신청액, 한도액, 판정으로 구성된 협력사업 신청 목록</caption>
          <thead>
            <tr>
              <th scope="col">지자체명</th>
              <th scope="col">인구수</th>
              <th scope="col">신청액</th>
              <th scope="col">한도액</th>
              <th scope="col">판정</th>
            </tr>
          </thead>
          <tbody id="applicationBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">판정 기준: 신청액 ≤ 한도액은 승인, 신청액 &gt; 한도액은 반려</div>
  </footer>
</body>
</html>
