<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 디지털혁신 백서의 장별 내용을 검색하고 열람하는 정적 웹페이지">
  <title>2026 디지털혁신 백서 검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">2026 행정안전부 디지털혁신 백서</p>
      <h1>백서 본문 검색</h1>
      <p class="intro">6개 장의 제목과 본문을 검색할 수 있습니다.</p>
      <div class="search-area" role="search">
        <label for="q">검색어</label>
        <div class="search-row">
          <input id="q" type="search" placeholder="예: 사업, 예산, 한지원" autocomplete="off">
          <button id="clear" type="button">초기화</button>
        </div>
        <p id="count" class="count" aria-live="polite"></p>
      </div>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <div id="list" class="card-list"></div>
    <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
  </main>
  <footer>본 페이지는 정적 HTML, CSS, JavaScript로 제작되었습니다.</footer>
  <script src="데이터.js"></script>
  <script src="app.js"></script>
</body>
</html>
