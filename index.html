<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 안전점검 보고서의 5개 장을 검색하고 열람하는 페이지">
  <title>2026 안전점검 보고서 검색</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">행정안전부 안전점검 보고서</p>
      <h1>2026 안전점검 보고서 검색</h1>
      <p class="intro">제목 또는 본문에 포함된 키워드로 5개 장을 검색할 수 있습니다.</p>
      <div class="search-row">
        <label class="sr-only" for="q">보고서 검색어</label>
        <input id="q" type="search" placeholder="검색어를 입력하세요 (예: 점검, 예산)" autocomplete="off">
        <button id="clearBtn" type="button">초기화</button>
      </div>
      <p id="count" class="count" aria-live="polite">데이터를 불러오는 중입니다.</p>
    </div>
  </header>

  <main class="container">
    <section id="list" class="card-grid" aria-label="보고서 장 목록"></section>
    <p id="message" class="message" hidden></p>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
