<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="지자체 협력사업 예산 신청의 승인 및 반려 여부를 자동 판정하는 페이지">
  <title>지자체 협력사업 예산 자동 판정</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#result-table">심사 결과 바로가기</a>

  <header class="hero">
    <div class="container">
      <p class="eyebrow">자치행정 협력사업</p>
      <h1>지자체별 예산 신청 자동 판정</h1>
      <p class="description">한도액은 인구수 × 10으로 계산하며, 신청액이 한도액보다 크면 반려됩니다.</p>
    </div>
  </header>

  <main class="container main-content">
    <section aria-labelledby="summary-title">
      <h2 id="summary-title">심사 요약</h2>
      <div class="summary-grid">
        <article class="summary-card approval-card">
          <span class="summary-label">승인 건수</span>
          <strong id="approved-count" class="summary-value">-</strong>
        </article>
        <article class="summary-card rejection-card">
          <span class="summary-label">반려 건수</span>
          <strong id="rejected-count" class="summary-value">-</strong>
        </article>
        <article class="summary-card amount-card">
          <span class="summary-label">승인 신청액 합계</span>
          <strong id="approved-total" class="summary-value">-</strong>
        </article>
      </div>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading">
        <h2 id="results-title">지자체별 심사 결과</h2>
        <p id="load-status" class="load-status" aria-live="polite">신청 목록을 불러오는 중입니다.</p>
      </div>

      <div class="table-wrap">
        <table id="result-table">
          <caption>지자체별 인구수, 신청액, 한도액 및 자동 판정 결과</caption>
          <thead>
            <tr>
              <th scope="col">지자체명</th>
              <th scope="col">인구수</th>
              <th scope="col">신청액</th>
              <th scope="col">한도액</th>
              <th scope="col">판정</th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
      <div id="error-message" class="error-message" role="alert" hidden></div>
    </section>
  </main>

  <footer>
    <div class="container">자치행정 협력사업 예산 심사 · 가상 자료</div>
  </footer>
</body>
</html>
